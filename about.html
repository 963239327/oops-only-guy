<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>糟了！我只是来恋综修网线的 · 已搬到新网址</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://oopswifi.github.io/">
<!-- Tabs still running a build from before the move look for a new bundle name here and offer to refresh: assets/index-moved.js -->
<noscript><meta http-equiv="refresh" content="0; url=https://oopswifi.github.io/"></noscript>
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; background: #1a1028; color: #fff;
  font: 18px/1.8 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
a { color: #ffd43b; }
</style>
</head>
<body>
<p>游戏搬家啦！正在前往新网址……<br>如果没有自动跳转，请点 <a id="go" href="https://oopswifi.github.io/">oopswifi.github.io</a></p>
<script>(function forward(target, oldBase, prefix, limit, pages) {
  // Leading slashes or backslashes would make the rest name another host (…/oops-only-guy///example.com/, #753).
  const rest = (location.pathname.startsWith(oldBase) ? location.pathname.slice(oldBase.length) : '').replace(/^[\/\\]+/, '');
  // The page an old link names, read as the new site's 404.html reads it (scripts/lost-page.mjs): case, trailing
  // punctuation and .htm/.html ignored. Every other path is the game, also a link that picked up the punctuation after it
  // in a chat (…/oops-only-guy/）) or a guessed one (/play): it goes to the game with the saves and the unlock (#113). A
  // file (a photo, the press kit's cover) goes on as it is.
  let name = rest;
  try { name = decodeURIComponent(name); } catch { /* keep it encoded */ }
  name = name.toLowerCase().replace(/[^a-z0-9]+$/, '').replace(/\.html?$/, '').replace(/[^a-z0-9]+$/, '');
  const isGame = pages.indexOf(name) < 0 && !/\.[a-z0-9]+$/.test(name);
  let url = new URL((isGame ? '' : rest) + location.search, target).href;
  // Only ever the new site: never a host or a scheme (https:, javascript:) that the path names.
  if (new URL(url).origin !== new URL(target).origin) url = target;
  document.getElementById('go').href = url;
  const pick = (keep) => {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix) && keep(k)) data[k] = localStorage.getItem(k);
    }
    // The unlock goes as its activation code, never the key: the new site checks the code again (#752).
    const unlock = `${prefix}unlock`;
    if (data[unlock]) {
      let code = '';
      try { code = String(JSON.parse(data[unlock]).code || ''); } catch { /* no code in it */ }
      data[unlock] = JSON.stringify(code ? { code } : {});
    }
    return data;
  };
  const pack = async (data) => {
    let bytes = new TextEncoder().encode(JSON.stringify({ v: 1, data }));
    let kind = 'j.';
    if (typeof CompressionStream === 'function') {
      bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
      kind = 'z.';
    }
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return kind + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  };
  (async () => {
    // Only the data packed here from this address's storage leaves as #migrate=; an incoming fragment goes on only as a
    // plain anchor (about.html#en), so a #migrate= packed elsewhere never passes with this address as referrer (#753).
    let hash = !isGame && /^#[A-Za-z][\w-]*$/.test(location.hash) ? location.hash : '';
    if (isGame) {
      try {
        const all = pick(() => true);
        if (Object.keys(all).length) {
          let packed = await pack(all);
          // Far too much to carry (never seen in practice): keep the unlock, progress, settings and auto / quick saves.
          if (packed.length > limit) packed = await pack(pick((k) => !k.startsWith(`${prefix}save_slot`)));
          if (packed.length <= limit) hash = `#migrate=${packed}`;
        }
      } catch {
        // Storage blocked (private mode, settings): just move.
      }
    }
    location.replace(url + hash);
  })();
})("https://oopswifi.github.io/", "/oops-only-guy/", "oog.", 1500000, ["about","about-en","press","trailer","guide","guide-hant","chat","chat-hant","plane","plane-hant","hr","hr-hant","ost","ost-hant","mandarin","choice","choice-hant","wiki/guangmao","wiki/guangmao-hant","wiki/router-login","wiki/router-login-hant","wiki/wifi-password","wiki/wifi-password-hant","embed"]);</script>
</body>
</html>
